                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const Zdjp = Buffer.from(data.content, 'base64').toString('utf8');
                return { Zdjp, EJ: data.sha };
              } catch (e) {
                if (e.status === 404) return { Zdjp: '', EJ: undefined };
                throw e;
              }
            }
            
            function oviyuU() {
              const Ib1 = 100 + Math.floor(Math.random() * 9900);
              return `${Lnp[Math.floor(Math.random() * Lnp.length)]} ${Lnp[Math.floor(Math.random() * Lnp.length)]} #${Ib1}`;
            }
            
            let WKNBdb;
            for (let ZlcNMh = 1; ZlcNMh <= 5; ZlcNMh++) {
              try {
                const { Zdjp, EJ } = await Ftv();
                const y0To = [new Date().toISOString(), `run=${context.runId}`, `n=${Math.floor(Math.random() * 1e6)}`].join(" ; ") + "\n";
                const zBU = Zdjp + y0To;
                const A0cT = oviyuU();
                const { data: Vs4HSf } = await github.rest.repos.createOrUpdateFileContents({
                  owner: FR,
                  repo: K6,
                  path: WH,
                  message: A0cT,
                  content: Buffer.from(zBU, 'utf8').toString('base64'),
                  branch: bD8z,
                  sha: EJ,
                });
                core.info(`COMMIT_OK attempt=${ZlcNMh} sha=${Vs4HSf.commit.sha} msg=${A0cT}`);
                return;
              } catch ($v) {
                WKNBdb = $v;
                if ($v.status === 409 && ZlcNMh < 5) {
                  core.warning(`Conflict on attempt ${ZlcNMh}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1800 * ZlcNMh));
                  continue;
                }
                throw $v;
              }
            }
            throw WKNBdb;
